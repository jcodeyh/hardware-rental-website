name: Application CI

on:
  push:
  pull_request:
    branches:
    - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: flake8 . --select=F
      # Everything else (line length, whitespace) is advisory only.
      - run: flake8 . --extend-ignore=F --exit-zero
      - run: pytest --cov=.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backend-test ./server
      - run: docker build -t frontend-test ./client

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the runner request the OIDC token; without this azure/login fails
      contents: read
    env:
      ACR: hardwarerentalacr
      RG: hardware-rental-rg
      SERVER_APP: hardware-rental-server
      CLIENT_APP: hardware-rental-client
      SERVER_FQDN: https://hardware-rental-server.gentleriver-0d43fc19.eastus.azurecontainerapps.io
      CLIENT_FQDN: https://hardware-rental-client.gentleriver-0d43fc19.eastus.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Writes a short-lived ACR token into the docker config that buildx reads
      - name: Log in to ACR
        run: az acr login --name $ACR

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.ACR }}.azurecr.io/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.ACR }}.azurecr.io/client:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ env.SERVER_FQDN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy server
        run: az containerapp update --name $SERVER_APP --resource-group $RG --image $ACR.azurecr.io/server:${{ github.sha }}

      - name: Deploy client
        # min replicas at 1 keeps application running
        run: az containerapp update --name $CLIENT_APP --resource-group $RG --image $ACR.azurecr.io/client:${{ github.sha }} --min-replicas 1

      - name: Smoke test
        run: |
          # /get_all_hw_names is deliberate: it is unauthenticated, and it
          # exercises app boot -> hardware blueprint registration -> Mongo.
          # A stub route like /main returns 200 even when the app is broken.
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors -o /dev/null "$SERVER_FQDN/get_all_hw_names"
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors -o /dev/null "$CLIENT_FQDN/"
