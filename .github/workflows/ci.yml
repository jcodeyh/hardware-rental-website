name: Application CI

on:
  push:
  pull_request:
    branches:
    - main

env:
  # GHCR image names must be lowercase.
  IMAGE_PREFIX: ghcr.io/jcodeyh/hardware-rental-website

jobs:
  dataservice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use a fake repository, so pyodbc never needs the ODBC driver here.
      - run: pip install -r requirements.txt
      # F-checks are correctness (unused imports, undefined names) and block the build.
      - run: flake8 . --select=F
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  # MongoDB and the old Flask server/ are not part of the vertical slice, so
  # they are neither tested nor built here.
  images:
    needs: [dataservice, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        name: [client, dataservice, gateway]
    env:
      # Only main pushes images; other branches and PRs just prove they build.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # The federated credential's subject is scoped to refs/heads/main, so only
    # main can log in. DEPLOY_ENABLED (a repo variable) stays unset until the
    # Container Apps and the deploy identity exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [images]
    runs-on: ubuntu-latest
    concurrency: deploy-main
    permissions:
      id-token: write   # lets the runner request the OIDC token; without this azure/login fails
      contents: read
    env:
      RG: Data_Management
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the three apps
        run: |
          for name in client dataservice gateway; do
            app=hardware-rental-$name
            [ "$name" = dataservice ] && app=hardware-rental-data
            az containerapp update -n "$app" -g "$RG" --image "$IMAGE_PREFIX/$name:${{ github.sha }}" -o none
          done

      - name: Smoke test through the gateway
        run: |
          GATEWAY=https://$(az containerapp show -n hardware-rental-gateway -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Gateway: $GATEWAY"
          # Apps scale to zero and the serverless database pauses, so the first
          # hit can take a minute or more; retry instead of failing on a cold start.
          for path in /healthz /dashboard /api/data/governments; do
            curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 150 -o /dev/null "$GATEWAY$path"
            echo "OK $path"
          done
