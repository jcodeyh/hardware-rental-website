server {
    # Not 8080: in Azure this container shares localhost with the gateway, which
    # owns 8080.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. react-router-dom handles routing in the browser, so the
    # server must return index.html for any path that isn't a real file --
    # otherwise refreshing on /login returns a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite build emits content-hashed filenames, so these can be cached
    # indefinitely -- a new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
