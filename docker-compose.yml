services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    env_file:
      - .env

  client:
    build: ./client
    ports:
      - "8080:3000"   # browse localhost:8080; nginx inside listens on 3000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
