services:
  server:
    build: ./server
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--reload", "app:app"]
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    env_file:
      - .env

  client:
    build: ./client
    ports:
      - "8080:8080"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
