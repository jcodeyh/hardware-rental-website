syntax = "proto3";

package users.v1;

service UsersService {
  rpc SignUp(SignUpRequest) returns (UserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc SetupTwoFactor(TwoFactorSetupRequest) returns (TwoFactorSetupResponse);
  rpc CompleteTwoFactor(TwoFactorCodeRequest) returns (UserResponse);
}

message User {
  string user_id = 1;
  string username = 2;
  string org_id = 3;
}

message SignUpRequest {
  string username = 1;
  string password = 2;
  string org_id = 3;
  string client_ip = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string client_ip = 3;
}

message LoginResponse {
  User user = 1;
  string mfa_token = 2;
  string next_step = 3;
}

message TwoFactorSetupRequest {
  string mfa_token = 1;
  string client_ip = 2;
}

message TwoFactorSetupResponse {
  string qr_code_data_url = 1;
  string secret = 2;
}

message TwoFactorCodeRequest {
  string mfa_token = 1;
  string code = 2;
  bool enroll = 3;
  string client_ip = 4;
}

message UserResponse {
  User user = 1;
}
