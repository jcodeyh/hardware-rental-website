syntax = "proto3";

package users.v1;

service UsersService {
  rpc SignUp(SignUpRequest) returns (UserResponse);
  rpc Login(LoginRequest) returns (UserResponse);
}

message User {
  string user_id = 1;
  string username = 2;
  string org_id = 3;
}

message SignUpRequest {
  string username = 1;
  string password = 2;
  string org_id = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message UserResponse {
  User user = 1;
}
