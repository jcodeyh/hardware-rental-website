syntax = "proto3";

package bff.hardware.v1;

service HardwareService {
  rpc ListHardware(ListHardwareRequest) returns (ListHardwareResponse);
  rpc CheckOut(CheckOutRequest) returns (HardwareActionResponse);
  rpc CheckIn(CheckInRequest) returns (HardwareActionResponse);
  rpc GetProjectHardware(GetProjectHardwareRequest) returns (GetProjectHardwareResponse);
  rpc ReserveHardware(ReserveHardwareRequest) returns (HardwareActionResponse);
  rpc GetUserHardware(GetUserHardwareRequest) returns (GetUserHardwareResponse);
}

message CheckOutRequest {
  string hardware_id = 1;
  string project_id = 2;
  string user_id = 3;
  int32 quantity = 4;
  string request_id = 5;
}

message CheckInRequest {
  string hardware_id = 1;
  string project_id = 2;
  string user_id = 3;
  int32 quantity = 4;
  string request_id = 5;
}

message HardwareActionResponse {
  bool success = 1;
}

message GetProjectHardwareRequest {
  string project_id = 1;
}

message ProjectHardware {
  string hardware_id = 1;
  string name = 2;
  string category = 3;
  int64 reserved = 4;
  int64 out = 5;
}

message GetProjectHardwareResponse {
  repeated ProjectHardware items = 1;
}

message ReserveHardwareRequest {
  string hardware_id = 1;
  string project_id = 2;
  string user_id = 3;
  int64 quantity = 4;
  string request_id = 5;
}

message GetUserHardwareRequest {
  string user_id = 1;
}

message UserHardware {
  string hardware_id = 1;
  string name = 2;
  string category = 3;
  int64 quantity = 4;
  int64 outstanding = 5;
}

message GetUserHardwareResponse {
  repeated UserHardware items = 1;
}

message ListHardwareRequest {
  int32 page = 1;
  int32 size = 2;
  string category = 3;
  string status = 4;
}

message HardwareItem {
  string id = 1;
  string name = 2;
  string category = 3;
  string asset_tag = 4;
  string status = 5;
  int64 total = 6;
  int64 out = 7;
  int64 reserved = 8;
  int64 version = 9;
  int64 available = 10;
}

message ListHardwareResponse {
  repeated HardwareItem items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 size = 4;
}
